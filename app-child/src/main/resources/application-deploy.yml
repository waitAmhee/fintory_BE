server:
  port: 8080

spring:
  config:
    activate:
      on-profile: deploy


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  batch:
    jdbc:
      initialize-schema: always


  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com
      chat:
        enabled: true
        options:
          model: ${OPENAI_MODEL}
          temperature: ${OPENAI_TEMPERATURE}
          max-tokens: ${OPENAI_MAX_TOKENS}
          timeout: 60s
          
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
          kakao:
            client-id: ${KAKAO_REST_CLIENT_ID}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


  main:
    allow-bean-definition-overriding: true

  data:
    redis:
      host: ${AWS_REDIS_HOST}
      port: 6379
      password: ${AWS_REDIS_PASSWORD}


jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus,metrics
  endpoint:
    health:
      show-details: always

hantu-openapi:
  appkey: ${HANTU_APPKEY}
  appsecret: ${HANTU_APPSECRET}
  base-url: https://openapi.koreainvestment.com:9443

db-openapi:
  db-appkey: ${DB_APPKEY}
  db-appsecret: ${DB_APPSECRET}
  base-url: https://openapi.dbsec.co.kr:8443

eos:
  api-key: ${EOS_API_KEY}

firebase:
  config: ${FIREBASE_CONFIG}

websocket:
  server:
    url: ${WEBSOCKET_PRIVATE_HOST}
